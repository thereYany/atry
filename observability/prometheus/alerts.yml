groups:
  - name: atry-slo
    rules:
      - alert: AtryBackendDown
        expr: up{job="atry-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "atry backend 不可达"
          description: "Prometheus 连续 2 分钟抓不到 atry-backend 的指标。"

      - alert: AtryHigh5xxRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "atry 5xx 比例超过 5%"
          description: "近 5 分钟 5xx 占比 {{ $value | humanizePercentage }}。"

      - alert: AtryP95LatencyHigh
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le)) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "atry HTTP p95 超过 1s"
          description: "近 10 分钟 p95 = {{ $value }}s。"

      - alert: AtryHeapPressure
        expr: sum(jvm_memory_used_bytes{area="heap"}) / sum(jvm_memory_max_bytes{area="heap"}) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "atry 堆内存使用率超过 90%"
          description: "当前堆使用率 {{ $value | humanizePercentage }}，检查泄漏或调大 mem_limit。"

      - alert: AtryLockFailures
        expr: increase(atry_lock_failed_total[10m]) > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "分布式锁失败增多"
          description: "10 分钟内锁获取失败 {{ $value }} 次，检查热点 key 或持锁过久。"

      - alert: AtryRateLimitSpike
        expr: sum(rate(atry_rate_limit_blocked_total[5m])) > 1
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "限流命中持续升高"
          description: "近 5 分钟每秒限流命中 >1，检查攻击或阈值配置。"
